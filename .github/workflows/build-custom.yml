name: Build Custom release
run-name: Custom build · ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v, e.g. 3.8.6'
        required: true
        default: '3.8.6'

concurrency:
  group: custom-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

jobs:
  build:
    name: Build portable package
    if: github.ref == 'refs/heads/Custom'
    runs-on: windows-latest

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: Custom
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Build portable packages
        id: build
        uses: ok-oldking/pyappify-action@69bf7ae364e8c7f0606f34df86d432168a46f4bf
        with:
          version: v1.2.7
          build_setup: false
          package_zip: true
          package_zip_format: 7z
          add_version_name: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-package
          path: pyappify_dist/*
          if-no-files-found: warn
          retention-days: 7

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: Custom
          name: v${{ inputs.version }}
          files: pyappify_dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
