name: Build Custom release
run-name: Custom build · ${{ inputs.version || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v, e.g. 3.8.15'
        required: false

concurrency:
  group: custom-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

jobs:
  build:
    name: Build offline package
    if: github.ref == 'refs/heads/Custom' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: Custom
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ github.ref_name }}" }
          $v = $v.TrimStart("v")
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Packaging version $v"

      - name: Prepare release requirements
        env:
          RELEASE_TAG: v${{ steps.v.outputs.version }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Publish the runtime-only tag
        shell: pwsh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag carries the runtime tree only: deploy.txt lists exactly that
          # set (ok/ and pyappify/ were just inlined into it), which keeps
          # ok_templates out. Its generated names run close to 190 characters and
          # overflow the 260-character path limit once the package nests them.
          $tag = "v${{ steps.v.outputs.version }}"
          $dest = Join-Path $env:RUNNER_TEMP "deploy"
          New-Item -ItemType Directory -Force $dest | Out-Null

          $copied = 0
          Get-Content deploy.txt | ForEach-Object {
            $p = $_.Trim()
            if (-not $p -or $p.StartsWith('#')) { return }
            if (-not (Test-Path $p)) { Write-Host "skip missing $p"; return }
            Copy-Item -Path $p -Destination (Join-Path $dest (Split-Path $p -Leaf)) -Recurse -Force
            $copied++
          }
          Write-Host "copied $copied deploy.txt entries"
          if ($copied -lt 5) { throw "deploy tree looks empty" }

          Set-Location $dest
          git init -q
          git config user.name "lqvsxb"
          git config user.email "lqvsxb@users.noreply.github.com"
          git add -A
          git commit -qm "runtime files for $tag"
          git tag $tag
          $url = "https://x-access-token:$env:TOKEN@github.com/lqvsxb/ok-wuthering-waves.git"
          git push -f $url "HEAD:refs/heads/deploy"
          git push -f $url "refs/tags/$tag"
          Write-Host "pushed runtime tree as $tag"

      - name: Trim to the runtime set
        shell: pwsh
        run: |
          # The archive is built from this checkout, so drop everything deploy.txt
          # does not list. Upstream avoids this by cloning a runtime-only update
          # repo; with a single repository, trimming is the equivalent.
          $remove = @('docs', 'tests', '.agents', '.codex', '.github', 'readme', 'ok_templates', '__pycache__')
          foreach ($item in $remove) {
            if (Test-Path $item) { Remove-Item -Recurse -Force $item }
          }
          Get-ChildItem -Recurse -Directory -Filter __pycache__ -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "remaining top level:"
          Get-ChildItem -Name | ForEach-Object { Write-Host "  $_" }

      - name: Build offline package
        id: build
        uses: ok-oldking/pyappify-action@master
        with:
          version: v1.2.8
          build_setup: false
          use_git_url: false
          package_zip: true
          package_zip_format: 7z
          package_zip_updater: false
          add_version_name: true

      - name: Collect diagnostics
        if: failure()
        shell: pwsh
        run: |
          $md = New-Object System.Collections.Generic.List[string]
          $md.Add("## Build diagnostics")
          Get-ChildItem -Path . -Recurse -Filter *.log -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object {
              $md.Add("### " + $_.FullName)
              $md.Add('```')
              $md.Add((Get-Content $_.FullName -Tail 80) -join "`n")
              $md.Add('```')
            }
          if (Test-Path pyappify_dist) {
            $md.Add("### pyappify_dist")
            $md.Add('```')
            $md.Add(((Get-ChildItem pyappify_dist -Recurse | Select-Object -First 40 -ExpandProperty FullName) -join "`n"))
            $md.Add('```')
          }
          ($md -join "`n") | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-package
          path: pyappify_dist/*
          if-no-files-found: warn
          retention-days: 7

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          files: pyappify_dist/*
          draft: true
          prerelease: false
          generate_release_notes: true
