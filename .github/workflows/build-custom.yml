name: Build Custom release
run-name: Custom build · ${{ inputs.version || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v, e.g. 3.8.9'
        required: false

concurrency:
  group: custom-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

jobs:
  build:
    name: Build portable package
    if: github.ref == 'refs/heads/Custom' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: Custom
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ github.ref_name }}" }
          $v = $v.TrimStart("v")
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Packaging version $v"

      - name: Prepare release requirements
        env:
          RELEASE_TAG: v${{ steps.v.outputs.version }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Publish the runtime-only tag
        shell: pwsh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The launcher treats version tags as installable snapshots, so a tag must
          # carry the runtime tree only. deploy.txt lists exactly that set (ok/ and
          # pyappify/ were just inlined into it by the previous step), which also
          # keeps ok_templates away: its ~190-character file names overflow the
          # Windows 260-character limit once nested in the launcher's working dir.
          $tag = "v${{ steps.v.outputs.version }}"
          $dest = Join-Path $env:RUNNER_TEMP "deploy"
          New-Item -ItemType Directory -Force $dest | Out-Null

          $copied = 0
          Get-Content deploy.txt | ForEach-Object {
            $p = $_.Trim()
            if (-not $p -or $p.StartsWith('#')) { return }
            if (-not (Test-Path $p)) { Write-Host "skip missing $p"; return }
            Copy-Item -Path $p -Destination (Join-Path $dest (Split-Path $p -Leaf)) -Recurse -Force
            $copied++
          }
          Write-Host "copied $copied deploy.txt entries into $dest"
          if ($copied -lt 5) { throw "deploy tree looks empty" }

          Set-Location $dest
          git init -q
          git config user.name "lqvsxb"
          git config user.email "lqvsxb@users.noreply.github.com"
          git add -A
          git commit -qm "runtime files for $tag"
          git tag $tag
          $url = "https://x-access-token:$env:TOKEN@github.com/lqvsxb/ok-wuthering-waves.git"
          git push -f $url "HEAD:refs/heads/deploy"
          git push -f $url "refs/tags/$tag"
          Write-Host "pushed runtime tree as tag $tag"

      - name: Build the launcher
        id: build
        uses: ok-oldking/pyappify-action@master
        with:
          version: v1.2.8
          app_version: v${{ steps.v.outputs.version }}
          # Launcher only. Both other outputs embed the clone and a full Python
          # environment: the offline zip reached 1.24 GB and the setup installer
          # ran past 35 minutes in the packaging step. The launcher pulls the
          # runtime tag and installs dependencies on first run instead.
          build_exe_only: true
          build_setup: false
          package_zip: false

      - name: Package the launcher
        shell: pwsh
        run: |
          $exe = "${{ steps.build.outputs.exe-path }}"
          if (-not (Test-Path $exe)) { throw "launcher not found at $exe" }
          $stage = Join-Path $env:RUNNER_TEMP "launcher"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "ok-ww.exe") -Force
          Copy-Item pyappify.yml $stage -Force
          if (Test-Path icons) { Copy-Item icons $stage -Recurse -Force }
          New-Item -ItemType Directory -Force pyappify_dist | Out-Null
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "pyappify_dist/ok-ww-win32-${{ steps.v.outputs.version }}.zip" -Force
          Get-ChildItem pyappify_dist | Format-Table Name, Length

      - name: Collect diagnostics
        if: failure()
        shell: pwsh
        run: |
          $md = New-Object System.Collections.Generic.List[string]
          $md.Add("## Build diagnostics")
          $logs = Get-ChildItem -Path . -Recurse -Filter *.log -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 3
          foreach ($f in $logs) {
            $md.Add("### " + $f.FullName)
            $md.Add('```')
            $md.Add((Get-Content $f.FullName -Tail 80) -join "`n")
            $md.Add('```')
          }
          if (Test-Path pyappify_dist) {
            $md.Add("### pyappify_dist tree")
            $md.Add('```')
            $md.Add(((Get-ChildItem pyappify_dist -Recurse -ErrorAction SilentlyContinue |
                      Select-Object -First 40 -ExpandProperty FullName) -join "`n"))
            $md.Add('```')
          }
          ($md -join "`n") | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-package
          path: pyappify_dist/*
          if-no-files-found: warn
          retention-days: 7

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          files: pyappify_dist/*
          draft: true
          prerelease: false
          generate_release_notes: true
