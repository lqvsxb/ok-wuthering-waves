name: Build Custom release
run-name: Custom build · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'custom-v*'
  workflow_dispatch:

concurrency:
  group: custom-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

jobs:
  build:
    name: Build portable package
    runs-on: windows-latest

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Prepare release requirements
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Build portable packages
        id: build
        uses: ok-oldking/pyappify-action@master
        with:
          version: v1.2.8
          build_setup: false
          use_git_url: false
          package_zip: true
          package_zip_format: 7z
          package_zip_updater: false
          add_version_name: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-package
          path: pyappify_dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: pyappify_dist/*
          draft: false
          prerelease: true
          generate_release_notes: true
