name: Build Custom release
run-name: Custom build · ${{ inputs.version || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v, e.g. 3.8.6'
        required: false

concurrency:
  group: custom-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

jobs:
  build:
    name: Build portable package
    if: github.ref == 'refs/heads/Custom' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: Custom
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ github.ref_name }}" }
          $v = $v.TrimStart("v")
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Packaging version $v"
          git tag -f "v$v"

      - name: Trim the source tree
        shell: pwsh
        run: |
          # ok_templates holds 4K annotation sources whose generated file names run
          # close to 190 characters. Inside the packaged working directory they push
          # paths past the Windows 260-character limit and the launcher fails with
          # "path too long". They are annotation sources only: runtime recognition
          # reads assets/templates, and upstream's deploy.txt does not ship them.
          Remove-Item -Recurse -Force ok_templates -ErrorAction SilentlyContinue
          if (Test-Path ok_templates) { throw "ok_templates still present" }

      - name: Build portable packages
        id: build
        uses: ok-oldking/pyappify-action@master
        with:
          version: v1.2.8
          build_setup: false
          use_git_url: false
          package_zip: true
          package_zip_format: 7z
          package_zip_updater: false
          add_version_name: true

      - name: Collect diagnostics
        if: failure()
        shell: pwsh
        run: |
          $md = New-Object System.Collections.Generic.List[string]
          $md.Add("## Build diagnostics")
          $logs = Get-ChildItem -Path . -Recurse -Filter *.log -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 3
          foreach ($f in $logs) {
            $md.Add("### " + $f.FullName)
            $md.Add('```')
            $md.Add((Get-Content $f.FullName -Tail 80) -join "`n")
            $md.Add('```')
          }
          if (Test-Path pyappify_dist) {
            $md.Add("### pyappify_dist tree")
            $md.Add('```')
            $md.Add(((Get-ChildItem pyappify_dist -Recurse -ErrorAction SilentlyContinue |
                      Select-Object -First 40 -ExpandProperty FullName) -join "`n"))
            $md.Add('```')
          }
          ($md -join "`n") | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-package
          path: pyappify_dist/*
          if-no-files-found: warn
          retention-days: 7

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: Custom
          name: v${{ steps.v.outputs.version }}
          files: pyappify_dist/*
          draft: true
          prerelease: false
          generate_release_notes: true
