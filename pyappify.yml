name: "ok-ww"
uac: true
icon: "icons/icon.png"
website: "http://ok-script.com/ok-ww"
keep_releases: 30

profiles:
  # Custom: 只保留一个 profile，产物为单一便携包。没有 git_url，
  # 配合工作流里的 use_git_url: false，直接打包本地运行时文件。
  - name: "Portable"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    use_pythonw: true
    pip_args: "--no-deps"
    show_add_defender: true
