name: "ok-ww"
uac: true
icon: "icons/icon.png"
website: "http://ok-script.com/ok-ww"
keep_releases: 30

profiles:
  - name: "China"
    # Custom: 不设 git_url，配合 use_git_url: false 直接打包本地文件，
    # 避免克隆 1.2 GB 仓库（克隆会把 ok_templates 的长文件名带回来）。
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    use_pythonw: true
    pip_args: "--no-deps"
    show_add_defender: true
    # PYTHONPATH: "your/default/path" # Optional, will be "" if missing

  - name: "Global"
    # Custom: 同上，Global profile 也不设 git_url。
    main_script: "main.py"
    requirements: "requirements.txt"


